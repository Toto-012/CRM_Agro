<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<title>CRM Agrícola</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1f2a1f;--mute:#6b7466;--line:#dcd8c9;--acc:#2f6b3a;--accink:#fff;--warn:#b3402a}
@media(prefers-color-scheme:dark){:root{--bg:#141a14;--card:#1e271e;--ink:#e9eee4;--mute:#97a291;--line:#2f3b2f;--acc:#6fbf7d;--accink:#10200f;--warn:#e8836c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 Georgia,"Iowan Old Style",serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.d{color:var(--warn)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:80px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.lock{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:340px;margin:0 auto;padding:20px;gap:12px;text-align:center}
.lock h1{margin:0}
.lock input{text-align:center;font-size:24px;letter-spacing:8px}
.bar{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:19px;margin:0 auto 0 0}
.dot{font-size:13px;color:var(--warn)}
.tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding-bottom:90px}
.sr{padding:0 14px 8px}
.list{padding:0 14px;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.item b{display:block}
.item span{color:var(--mute);font-size:15px}
.empty{padding:30px 14px;color:var(--mute);text-align:center}
.tot{padding:0 14px 8px;color:var(--mute)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));padding:14px 20px;border-radius:30px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.md h2{margin:0 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
.row .p{flex:1}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const T={
clientes:{n:'Clientes',s:'cliente',f:[['nombre','Nombre'],['cuit','CUIT'],['telefono','Teléfono','tel'],['localidad','Localidad / campo'],['notas','Notas','area']]},
stock:{n:'Stock',s:'producto',f:[['producto','Producto'],['cantidad','Cantidad','number'],['unidad','Unidad (litros, kg, bolsas)'],['notas','Notas','area']]},
aplicaciones:{n:'Aplicaciones',s:'aplicación',f:[['fecha','Fecha','date'],['cliente','Cliente','cli'],['lote','Lote'],['modalidad','Modalidad',['Terrestre','Aérea']],['has','Hectáreas','number'],['clase','Tipo (herbicida, fungicida...)'],['producto','Producto'],['precio','Precio por ha','number'],['monto','Monto','ro'],['fechapago','Fecha de pago','date']]},
facturacion:{n:'Facturación',s:'factura',f:[['fecha','Fecha de facturación','date'],['cliente','Cliente','cli'],['cuit','CUIT'],['nfactura','N° de factura'],['monto','Importe','number'],['estado','Estado',['Pendiente','Pago']],['fechapago','Fecha de pago','date'],['metodo','Método de pago']]},
llamadas:{n:'Llamadas',s:'llamada',f:[['fecha','Fecha','date'],['cliente','Cliente','cli'],['motivo','Motivo','area'],['seguimiento','Requiere seguimiento',['No','Sí']]]}
};
const empty=()=>Object.fromEntries(Object.keys(T).map(k=>[k,[]]));
let D=empty(),tab='clientes',q='',dirty=false;
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ba-crm:'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

const money=v=>'$'+Number(v).toLocaleString('es-AR');
const fd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s.split('-').reverse().join('/'):(s||'');
const days360=(a,b)=>{const p=s=>s.split('-').map(Number);let[y1,m1,d1]=p(a),[y2,m2,d2]=p(b);if(d1===31)d1=30;if(d2===31&&d1>=30)d2=30;return 360*(y2-y1)+30*(m2-m1)+(d2-d1)};
const nm=()=>ls.get('emp')||'CRM Agrícola';
function lock(){
 const has=ls.get('pinh');
 app.innerHTML=`<div class="lock"><h1>${esc(nm())}</h1><div>${has?'Ingresa tu PIN':'Crea un PIN de 4 a 6 dígitos'}</div>
 <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
 <button class="p" id="go">${has?'Entrar':'Crear PIN'}</button><div id="err" class="dot"></div></div>`;
 const go=async()=>{const v=$('pin').value;
  if(!/^\d{4,6}$/.test(v)){$('err').textContent='Usa entre 4 y 6 números.';return}
  const h=await hash(v);
  if(!has){ls.set('pinh',h);main()}
  else if(h===has)main();
  else{$('err').textContent='PIN incorrecto.';$('pin').value=''}};
 $('go').onclick=go;$('pin').onkeydown=e=>{if(e.key==='Enter')go()};$('pin').focus();
}

function title(k,r){return r[T[k].f[0][0]]||r[T[k].f[1]?.[0]]||'(sin nombre)'}
function render(){
 const L=D[tab].map((r,i)=>[r,i]).filter(([r])=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 if(['aplicaciones','facturacion','llamadas'].includes(tab))L.sort((a,b)=>(b[0].fecha||'').localeCompare(a[0].fecha||''));
 const cards=L.map(([r,i])=>{
  const t=tab==='clientes'||tab==='stock'?r[T[tab].f[0][0]]:[fd(r.fecha),r.cliente].filter(Boolean).join(' - ')||'(sin datos)';
  const rest=T[tab].f.filter(([k],j)=>!(tab==='clientes'||tab==='stock'?j===0:k==='fecha'||k==='cliente')).map(([k,l,t])=>r[k]!==undefined&&r[k]!==''?`${l.split(' (')[0]}: ${['monto','precio'].includes(k)?money(r[k]):t==='date'?fd(r[k]):r[k]}`:'').filter(Boolean);
  if(tab==='aplicaciones'&&r.fecha){const dd=days360(r.fecha,r.fechapago||new Date().toISOString().slice(0,10));rest.push(r.fechapago?`Días a pago: ${dd}`:`Días impago: ${dd}`)}
  return `<div class="item" data-i="${i}"><b>${esc(t)}</b><span>${esc(rest.join(' | '))}</span></div>`}).join('');
 const sum=a=>a.reduce((s,r)=>s+Number(r.monto||0),0);
 const pend=tab==='facturacion'?sum(D.facturacion.filter(r=>r.estado!=='Pago')):tab==='aplicaciones'?sum(D.aplicaciones.filter(r=>!r.fechapago)):null;
 app.innerHTML=`<div class="wrap"><div class="bar"><h1>${esc(nm())}</h1>${dirty?'<span class="dot">Cambios sin guardar</span>':''}
 <button id="em">Empresa</button><button id="ld">Cargar datos</button><button id="sv" class="p">Guardar cambios</button></div>
 <div class="tabs">${Object.keys(T).map(k=>`<button data-t="${k}" class="${k===tab?'on':''}">${T[k].n}</button>`).join('')}</div>
 <div class="sr"><input id="q" type="search" placeholder="Buscar en ${T[tab].n.toLowerCase()}" value="${esc(q)}"></div>
 ${pend!==null?`<div class="tot">${tab==='facturacion'?'Facturas pendientes de cobro':'Aplicaciones sin cobrar'}: ${money(pend)}</div>`:''}
 <div class="list">${cards||`<div class="empty">${D[tab].length?'Sin resultados.':'Todavía no hay datos. Toca "Agregar" o carga tu archivo.'}</div>`}</div></div>
 <button class="fab p" id="add">+ Agregar</button>`;
 document.title=nm();
 $('em').onclick=()=>{const v=prompt('Nombre de la empresa',ls.get('emp')||'');if(v!==null){ls.set('emp',v.trim());dirty=true;render()}};
 $('ld').onclick=()=>$('file').click();$('sv').onclick=save;$('add').onclick=()=>form(-1);
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;q='';render()});
 document.querySelectorAll('.item').forEach(b=>b.onclick=()=>form(+b.dataset.i));
 $('q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};
}

function form(i){
 const r=i>=0?D[tab][i]:{};const c=T[tab];
 const dl=`<datalist id="cl">${D.clientes.map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist>`;
 const fs=c.f.map(([k,l,t])=>{if(t==='ro')return '';const v=esc(r[k]??(k==='fecha'&&i<0?new Date().toISOString().slice(0,10):''));
  const inp=Array.isArray(t)?(()=>{const op=!r[k]||t.includes(r[k])?t:[r[k],...t];return `<select name="${k}">${op.map(o=>`<option${(r[k]||t[0])===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`})()
  :t==='area'?`<textarea name="${k}">${v}</textarea>`
  :`<input name="${k}" type="${t==='cli'?'text':t||'text'}" ${t==='cli'?'list="cl"':''} ${t==='number'?'step="any" inputmode="decimal"':''} value="${v}">`;
  return `<label>${l}</label>${inp}`}).join('');
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md"><h2>${i>=0?'Editar':'Nuevo'} ${c.s}</h2>${dl}${fs}<div class="row"><button id="x">Cancelar</button>${i>=0?'<button id="dl" class="d">Eliminar</button>':''}<button id="ok" class="p">Guardar</button></div></div>`;
 document.body.appendChild(o);
 const cu=o.querySelector('[name=cuit]'),cl=o.querySelector('[name=cliente]');
 if(cu&&cl)cl.onchange=()=>{const m=D.clientes.find(x=>x.nombre===cl.value.trim());if(m&&m.cuit&&!cu.value)cu.value=m.cuit};
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelector('#x').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=()=>{const n={};o.querySelectorAll('[name]').forEach(e=>n[e.name]=e.value.trim());
  if(tab==='aplicaciones')n.monto=String((+n.has||0)*(+n.precio||0));
  if(i>=0)D[tab][i]=n;else D[tab].push(n);dirty=true;o.remove();render()};
 if(i>=0)o.querySelector('#dl').onclick=()=>{if(confirm('¿Eliminar este registro?')){D[tab].splice(i,1);dirty=true;o.remove();render()}};
}

async function save(){
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const name=`crm-agricola_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
 const file=new File([JSON.stringify({version:1,guardado:d.toISOString(),empresa:ls.get('emp')||'',...D},null,1)],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file]});dirty=false;render();toast('Elige "Guardar en Archivos"');return}
  catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
 dirty=false;render();toast('Archivo descargado: '+name);
}

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(dirty&&!confirm('Tienes cambios sin guardar. ¿Cargar igual y descartarlos?')){e.target.value='';return}
 const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=='object'||!o)throw 0;
  if(typeof o.empresa==='string')ls.set('emp',o.empresa);D=empty();Object.keys(D).forEach(k=>{if(Array.isArray(o[k]))D[k]=o[k]});dirty=false;render();toast('Datos cargados: '+f.name)}
  catch(x){toast('Ese archivo no es válido')}};
 r.readAsText(f);e.target.value='';
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function main(){render()}
lock();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
